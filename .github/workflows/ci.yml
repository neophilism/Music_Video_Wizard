name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: music_video_wizard_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d music_video_wizard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/music_video_wizard_ci
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      ASSET_STORAGE_DRIVER: local
      ASSET_STORAGE_BUCKET: ci-assets
      JOB_QUEUE_SCHEMA: pgboss
      JOB_RETRY_LIMIT: 3
      JOB_RETRY_DELAY_SECONDS: 1
      JOB_RETRY_DELAY_MAX_SECONDS: 5
      JOB_EXPIRE_SECONDS: 600
      JOB_HEARTBEAT_SECONDS: 10
      JOB_WORKER_CONCURRENCY: 2
      JOB_WORKSPACE_CONCURRENCY: 1
      AUDIO_ANALYSIS_PYTHON: python
      AUDIO_ANALYSIS_FFMPEG: ffmpeg
      AUDIO_TRANSCRIPTION_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python -m pip install --disable-pip-version-check -r analysis/requirements.txt
      - run: npm install
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:graph
      - run: npm run test:inheritance
      - run: npm run test:library
      - run: npm run test:kits
      - run: npm run test:wizard
      - run: npm run test:analysis
      - run: npm run test:map
      - run: npm run test:brief
      - run: npm run test:concepts
      - run: npm run test:queue
      - run: npm run build
